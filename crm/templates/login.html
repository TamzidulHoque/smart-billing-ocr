{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block nav %}{% endblock %}
{% block body %}
<main class="login-wrap">
  <div class="card login-card">
    <h2>Log in</h2>
    <p class="hint">Use your staff email and password.</p>
    <div id="alert" class="alert hidden"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="submit" class="btn btn-block" type="submit">Log in</button>
    </form>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script>
  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("alert");
  const submit = document.getElementById("submit");

  function safeNext() {
    const next = new URLSearchParams(location.search).get("next") || "";
    return next.startsWith("/account/") && !next.startsWith("//") ? next : "/account/billing/";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    hideAlert(alertBox);
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) { showAlert(alertBox, "Enter your email and password."); return; }
    submit.disabled = true;
    submit.textContent = "Logging in…";
    try {
      const response = await fetch("/account/api/login/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error(response.status === 429 ? "Too many attempts. Wait a minute and try again." : errorMessage(data, response.status));
      Auth.save(data);
      location.href = safeNext();
    } catch (error) {
      showAlert(alertBox, error.message);
      submit.disabled = false;
      submit.textContent = "Log in";
    }
  });
</script>
{% endblock %}
