{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Billing{% endblock %} · Smart Billing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Ctext x='16' y='21' font-size='13' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ESB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'billing' %}"><span class="brand-mark">SB</span><span>Smart Billing</span></a>
      {% block nav %}
      <nav class="nav">
        <a href="{% url 'billing' %}" class="{% if request.resolver_match.url_name == 'billing' %}active{% endif %}">New Bill</a>
        <a href="{% url 'bills' %}" class="{% if request.resolver_match.url_name == 'bills' or request.resolver_match.url_name == 'bill_detail' %}active{% endif %}">Bills</a>
        <a href="{% url 'customers' %}" class="{% if request.resolver_match.url_name == 'customers' %}active{% endif %}">Customers</a>
      </nav>
      <button id="logout" class="btn btn-light" type="button">Log out</button>
      {% endblock %}
    </div>
  </header>
  {% block body %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="{% static 'js/api.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
